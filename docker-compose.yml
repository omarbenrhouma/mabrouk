services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ayouta
      POSTGRES_USER: ayouta
      POSTGRES_PASSWORD: ayouta_dev
    ports:
      - "5433:5432"
    volumes:
      - ayouta_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayouta -d ayouta"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ayouta_postgres:
